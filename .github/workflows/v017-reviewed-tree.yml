name: Verdugo v0.17 reviewed tree
on:
  push:
    branches: [feat/v0.17-tanda1-read-connectors]
    paths: ['.github/workflows/v017-reviewed-tree.yml']
permissions:
  contents: write
jobs:
  reviewed-tree:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify transport checksums and exact source tree before any execution
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, io, json, os, subprocess
          from pathlib import Path
          baseline='35516f830cba1e0dbb06b91f44357128440fc832'
          base_tree='9533a6aeb23bad5ec6d23fced6c7c033b256a8f0'
          expected='ff76f807297bb9df43e9fcfa93cfe8ef7d07d984'
          digest='37fd647fdad6ba4aa067369e8c70a4533ab087c39c60fc1c290ab31d8b5eb223'
          subprocess.run(['git','merge-base','--is-ancestor',baseline,'HEAD'],check=True)
          assert subprocess.check_output(['git','rev-parse',baseline+'^{tree}'],text=True).strip()==base_tree
          hashes={
            '.handoff/v017-0.b64':'56189ccd9df32f67ee33844bd4506b154d49b41eae1e9a4865b8f562ffd0376b',
            '.handoff/v017s-04.b64':'7f634f3ef4966ef5c9534920f0fc05461380c6d14b67c19b43710d6a50e87de0',
            '.handoff/v017s-05.b64':'527feb684d413398a96d3206ed6cb024af5a03fb3c0beb784973e549a641dd73',
            '.handoff/v017s-06.b64':'a5ba7891b8f18d36d3135add407e10fc8ca33bbf771f80266d8d83e7b3397e6b',
            '.handoff/v017s-07.b64':'3ef44f569fe4789317c5d6e28e14114d0bb0da0122a44fa5e1e510702bf7cfeb',
            '.handoff/v017s-08.b64':'e4cdf14a8c37d1db9a673cd15c1b09622924e9ace55db09b2614f61badbab9e7',
            '.handoff/v017s-09.b64':'5947a0a2f5c8f88519aa0e4a7d07859663bc074c41b630cfb26b70e9b0109793',
            '.handoff/v017s-10.b64':'88eb238af0cb1be298380f0a166afdc8d1698cd8b24daa8406208579933a96b0',
            '.handoff/v017s-11.b64':'e48392fddad32074574da039fe82e02347f4bb97d946d6ad3531b93aba849f3e',
            '.handoff/v017s-12.b64':'af1880e934f56ba719bc763480bcc6de1f072694dcfcfc71c6f3228b17ceb9cf',
            '.handoff/v017s-13.b64':'fdec0dd8d95f4eeeda3b8b13a45a455cd1c1a36cd6c10440842fdbda90fb4a0d',
            '.handoff/v017s-14.b64':'5d2ebc41ed05c4e49a018d6aa26589540ccff2c0639a19b11f2e20c75816d7f4',
            '.handoff/v017s-15.b64':'f3f0d80d084686ef384ae7b3a2f4713fa4202bcfef441f53c7f82646142a7d69'}
          parts=[];bad=[]
          for name,sha in hashes.items():
            data=Path(name).read_text().strip().encode('ascii')
            observed=hashlib.sha256(data).hexdigest()
            print(name,len(data),observed,observed==sha,flush=True)
            if observed!=sha:bad.append(name)
            parts.append(data)
          assert not bad, 'Transport checksum mismatch: '+','.join(bad)
          encoded=b''.join(parts);assert len(encoded)==31968
          with gzip.GzipFile(fileobj=io.BytesIO(base64.b64decode(encoded,validate=True))) as stream:
            patch=stream.read(86001)
          assert len(patch)==86000 and hashlib.sha256(patch).hexdigest()==digest
          path=Path('/tmp/verdugo-reviewed.patch');path.write_bytes(patch)
          files=['.github/workflows/verify.yml','README.md','docs/CONECTORES_V015.md','docs/PLAN_CONEXION.md','docs/TANDA1_V017.md','docs/plan_conexion.json','examples/tanda1-readiness.json','sources/contracts-v017.json','tests/test_bridge_v02.py','tests/test_core.py','tests/test_extended_runtime_v010.py','tests/test_license_policy_v014.py','tests/test_local_runtime_v09.py','tests/test_office_v07.py','tests/test_service_reads_v015.py','tests/test_surfaces_v04.py','tests/test_tanda1_reads_v017.py','verdugo/__init__.py','verdugo/__main__.py','verdugo/adapters.py','verdugo/read_contracts.py','verdugo/tanda1_reads.py','verdugo/transport.py']
          changed=[line.split('\t')[2] for line in subprocess.check_output(['git','apply','--numstat',str(path)],text=True).splitlines()]
          assert sorted(changed)==sorted(files) and len(changed)==23
          subprocess.run(['git','apply','--check',str(path)],check=True)
          subprocess.run(['git','apply',str(path)],check=True)
          env={**os.environ,'GIT_INDEX_FILE':'/tmp/verdugo-release-index'}
          subprocess.run(['git','read-tree',base_tree],env=env,check=True)
          subprocess.run(['git','add','--',*files],env=env,check=True)
          tree=subprocess.check_output(['git','write-tree'],env=env,text=True).strip()
          assert tree==expected,(tree,expected)
          for name in files:assert Path(name).is_file() and not Path(name).is_symlink()
          Path('/tmp/verdugo-publish-files.json').write_text(json.dumps(files))
          print('REVIEWED_TREE_VERIFIED='+tree,flush=True)
          PY
      - name: Execute all tests on the exact reviewed source (no upstream services claimed)
        run: |
          python3 -m compileall -q verdugo
          python3 - <<'PY'
          import json, os, unittest
          from pathlib import Path
          from verdugo.connections import summary
          suite=unittest.defaultTestLoader.discover('tests')
          result=unittest.TextTestRunner(verbosity=2).run(suite)
          assert result.wasSuccessful() and result.testsRun==456
          new=unittest.TextTestRunner(verbosity=2).run(unittest.defaultTestLoader.discover('tests',pattern='test_tanda1_reads_v017.py'))
          assert new.wasSuccessful() and new.testsRun==24
          state=summary()
          assert state['registered']==322 and state['live_verified']==0
          assert state['states']=={'conectado':63,'pieza_de_construccion':56,'pendiente':181,'excluido':22}
          report={'baseline_commit':'35516f830cba1e0dbb06b91f44357128440fc832','tested_tree':'ff76f807297bb9df43e9fcfa93cfe8ef7d07d984','patch_sha256':'37fd647fdad6ba4aa067369e8c70a4533ab087c39c60fc1c290ab31d8b5eb223','run_id':os.environ['GITHUB_RUN_ID'],'total_tests':result.testsRun,'new_contract_tests':new.testsRun,'tests_passed':True,'states':state['states'],'actual_upstream_servers_executed':False,'permanent_deployment':False,'live_verified':0,'branch_refs_changed_by_workflow':False}
          Path('/tmp/verdugo-reviewed-result.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report),flush=True)
          PY
      - name: Publish only immutable Git blobs and tree; never commits or refs
        env:
          GH_OBJECT_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,os,subprocess,urllib.error,urllib.request
          from pathlib import Path
          repo='josuechavando350-png/Verdugo-Digital'
          expected='ff76f807297bb9df43e9fcfa93cfe8ef7d07d984'
          assert os.environ['GITHUB_REPOSITORY']==repo
          env={**os.environ,'GIT_INDEX_FILE':'/tmp/verdugo-release-index'}
          assert subprocess.check_output(['git','write-tree'],env=env,text=True).strip()==expected
          report=json.loads(Path('/tmp/verdugo-reviewed-result.json').read_text())
          assert report['tests_passed'] and report['total_tests']==456
          def post(kind,body):
            assert kind in ('blobs','trees')
            req=urllib.request.Request('https://api.github.com/repos/'+repo+'/git/'+kind,data=json.dumps(body).encode(),headers={'Authorization':'Bearer '+os.environ['GH_OBJECT_TOKEN'],'Content-Type':'application/json','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'},method='POST')
            try:
              with urllib.request.urlopen(req,timeout=45) as response:return json.load(response)
            except urllib.error.HTTPError as error:raise RuntimeError('Git object publication HTTP '+str(error.code)) from None
          entries=[]
          for name in json.loads(Path('/tmp/verdugo-publish-files.json').read_text()):
            body=Path(name).read_bytes()
            sha=hashlib.sha1(b'blob '+str(len(body)).encode()+b'\0'+body).hexdigest()
            observed=post('blobs',{'content':base64.b64encode(body).decode(),'encoding':'base64'})['sha']
            assert observed==sha,(name,observed,sha)
            entries.append({'path':name,'mode':'100644','type':'blob','sha':sha})
          tree=post('trees',{'base_tree':'9533a6aeb23bad5ec6d23fced6c7c033b256a8f0','tree':entries})['sha']
          assert tree==expected,(tree,expected)
          report['published_tree']=tree
          report['publication_status']='immutable_tree_ready_for_connector_commit'
          Path('/tmp/verdugo-reviewed-result.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report),flush=True)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: verdugo-v017-reviewed-result
          path: /tmp/verdugo-reviewed-result.json
          retention-days: 1
          if-no-files-found: warn
