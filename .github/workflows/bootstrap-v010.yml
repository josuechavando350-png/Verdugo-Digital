name: Apply reviewed v0.10 source patch
on:
  push:
    branches: [feat/verdugo-runtime-v010]
    paths: [.github/workflows/bootstrap-v010.yml]
permissions:
  contents: read
jobs:
  apply:
    if: github.repository == 'josuechavando350-png/Verdugo-Digital' && github.ref == 'refs/heads/feat/verdugo-runtime-v010'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify fixed input and apply only the reviewed source patch
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, pathlib, subprocess
          base = '003233f49b48eef76793b9eb8de2c3b533c191b0'
          subprocess.run(['git', 'merge-base', '--is-ancestor', base, 'HEAD'], check=True)
          allowed = {f'maintenance/v010-{i}.b64' for i in range(4)} | {'.github/workflows/bootstrap-v010.yml'}
          changed = set(subprocess.check_output(['git','diff','--name-only',base,'HEAD'], text=True).splitlines())
          if not changed <= allowed:
              raise SystemExit('Work branch has unexpected changes; refusing to overwrite')
          data = ''.join(pathlib.Path(f'maintenance/v010-{i}.b64').read_text().strip() for i in range(4))
          if len(data) != 20008:
              raise SystemExit('Unexpected patch size')
          raw = gzip.decompress(base64.b64decode(data, validate=True))
          if len(raw) != 47936 or hashlib.sha256(raw).hexdigest() != 'd5c37667bf07c0437d9c010fadc9ade552f4d8b7ee0bace399b49cfef9740bd3':
              raise SystemExit('Patch checksum mismatch')
          pathlib.Path('/tmp/verdugo-v010.patch').write_bytes(raw)
          subprocess.run(['git','apply','--check','/tmp/verdugo-v010.patch'], check=True)
          subprocess.run(['git','apply','--index','/tmp/verdugo-v010.patch'], check=True)
          PY
          # Workflow changes are performed separately through the authorized connector.
          git restore --source=HEAD --staged --worktree .github/workflows/runtime-acceptance.yml
          git rm -- maintenance/v010-0.b64 maintenance/v010-1.b64 maintenance/v010-2.b64 maintenance/v010-3.b64
          git diff --cached --check
      - name: Test code before publishing to its work branch
        run: |
          python3 -m unittest discover -s tests -q
          python3 -m verdugo --state :memory: status > /tmp/v010-status.json
          python3 - <<'PY'
          import json
          s=json.load(open('/tmp/v010-status.json'))
          assert s['registered']==100 and s['live_verified']==0
          print('Core verified; real-library acceptance is still pending')
          PY
      - name: Commit and push without force to the same work branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(verdugo): add seven bounded local operations and acceptance tests'
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/feat/verdugo-runtime-v010
