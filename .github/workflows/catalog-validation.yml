name: Growth Engine — Catalog Contract
on:
  push:
    branches:
      - feat/growth-engine-ten-clean-20261112
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate catalog schema and status claims
        run: python -m unittest discover -s tests -v
