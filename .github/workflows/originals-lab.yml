name: Originals — Authentic Application Laboratory
on:
  push:
    branches: [feat/growth-engine-ten-clean-20261112]
    paths:
      - 'deploy/originals/**'
      - 'scripts/originals-*'
      - '.github/workflows/originals-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: originals-lab-${{ github.ref }}
  cancel-in-progress: true
jobs:
  original-applications:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      VERDUGO_LAB_CONFIRM: synthetic-only
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Install and interrogate authentic original applications
        run: bash scripts/originals-lab.sh
      - name: Upload bounded evidence without credentials
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: originals-evidence-${{ github.sha }}
          path: |
            evidence/originals/images.json
            evidence/originals/acceptance.json
          if-no-files-found: warn
          retention-days: 7
