name: Verdugo source snapshot for v0.18
on:
  push:
    branches: [feat/v0.18-tanda1-service-readiness]
    paths: [.github/workflows/source-snapshot-v018.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: da34f47b6bc6116e553f08801e281f1e695dcc8c
          persist-credentials: false
          submodules: false
      - name: Archive only tracked public source from the verified base
        run: |
          test "$(git rev-parse HEAD)" = da34f47b6bc6116e553f08801e281f1e695dcc8c
          git archive --format=tar.gz HEAD --output="$RUNNER_TEMP/verdugo-v017-source.tar.gz"
          sha256sum "$RUNNER_TEMP/verdugo-v017-source.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: verdugo-v017-source
          path: ${{ runner.temp }}/verdugo-v017-source.tar.gz
          retention-days: 1
          if-no-files-found: error
