name: Native integration — apply reviewed capture source edits
on:
  push:
    branches: [feat/growth-engine-ten-clean-20261112]
    paths:
      - 'integration-patches/openreplay-capture.json'
      - '.github/workflows/apply-native-capture-source.yml'
permissions:
  contents: read
concurrency:
  group: reviewed-capture-source-edit
  cancel-in-progress: false
jobs:
  apply-reviewed-edit:
    if: github.repository == 'josuechavando350-png/Verdugo-Digital' && github.ref == 'refs/heads/feat/growth-engine-ten-clean-20261112'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Require exact source preimages and postimages
        run: python scripts/apply-reviewed-native-patch.py integration-patches/openreplay-capture.json
      - name: Test reviewed code, without running provider containers with write credentials
        run: python -m unittest discover -s tests -p 'test_native*.py' -v
      - name: Commit only the reviewed three-file edit to the existing feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- scripts/native-pair-acceptance.py scripts/native_extra_apps.py scripts/native_openreplay.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat(native): apply verified capture transport and private volume edits'
          git push origin HEAD:refs/heads/feat/growth-engine-ten-clean-20261112
