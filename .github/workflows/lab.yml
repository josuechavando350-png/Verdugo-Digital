name: Verdugo lab probe
on:
  push:
    branches: ['lab/**']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install pinned analytics profile
        run: |
          python -m venv --copies /tmp/verdugo-analytics-venv
          chmod go-w /tmp/verdugo-analytics-venv/bin/python*
          /tmp/verdugo-analytics-venv/bin/python -m pip install -r requirements/runtime-analytics.txt > /tmp/pip-all.log 2>&1 || { tail -40 /tmp/pip-all.log; exit 1; }
          /tmp/verdugo-analytics-venv/bin/python -m pip freeze > /tmp/analytics-resolved.txt
          grep -v '^#' requirements/runtime-analytics.constraints.txt | sort -f > /tmp/expected.txt
          sort -f /tmp/analytics-resolved.txt > /tmp/actual.txt
          diff /tmp/expected.txt /tmp/actual.txt && echo "LAB-FREEZE-MATCHES"
          /tmp/verdugo-analytics-venv/bin/python -m pip check
      - name: Direct recipe diagnostics without network
        run: |
          sudo unshare --net -- setpriv --reuid="$(id -u)" --regid="$(id -g)" --clear-groups -- env \
            HOME="$HOME" /tmp/verdugo-analytics-venv/bin/python lab/driver.py | grep -E "PROBE-(FAIL|TIMEOUT|STDERR)|PROBE-OK splink|Error|File " || true
      - name: Engine acceptance for analytics recipes without network
        run: |
          PY="$(which python)"
          sudo unshare --net -- setpriv --reuid="$(id -u)" --regid="$(id -g)" --clear-groups -- env \
            HOME="$HOME" VERDUGO_RUNTIME_REQUIRED=1 \
            VERDUGO_RUNTIME_SERVICES=networkx,statsmodels,polars,sqlglot,faker,pandera,datasketch,h3,lifelines,pyod,river,numpy-financial,nashpy,pymcdm,mlxtend,arrow,markitdown,great-tables,spacy,parsedmarc,shap,statsforecast,opendp,splink,ibis,advertools,dnstwist \
            VERDUGO_ANALYTICS_PYTHON=/tmp/verdugo-analytics-venv/bin/python \
            "$PY" -m unittest discover -s tests_runtime -p 'test_libraries.py' -v
