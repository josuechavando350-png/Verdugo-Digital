name: Native originals — Formbricks survey integration
on:
  push:
    branches: [feat/growth-engine-ten-clean-20261112]
    paths:
      - 'scripts/native_formbricks.py'
      - 'tests/test_native_formbricks.py'
      - '.github/workflows/native-formbricks-acceptance.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-formbricks-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native-formbricks:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {submodules: false, persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22.16.0'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Unit safeguards, not provider acceptance
        run: python -m unittest discover -s tests -p 'test_native*.py' -v
      - name: Require native survey/response APIs and persisted shared route
        run: python scripts/native-extensions-acceptance.py --providers formbricks --output evidence/extra-formbricks.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-formbricks-${{ github.run_id }}
          path: evidence/extra-formbricks.json
          if-no-files-found: warn
          retention-days: 7
