name: Verdugo verification
on:
  push:
    branches: [main, feat/verdugo-unified-core]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verdugo-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout pinned source action
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Compile and execute local tests
        run: |
          python3 --version
          python3 -m compileall -q verdugo
          python3 -m unittest discover -s tests -v
      - name: Termux compatibility simulation
        run: |
          python3 - <<'PY'
          import os
          import unittest
          os.umask(0o077)
          if hasattr(os, 'link'):
              del os.link
          suite = unittest.defaultTestLoader.discover('tests')
          result = unittest.TextTestRunner(verbosity=1).run(suite)
          assert result.wasSuccessful(), 'Simulated Termux regression'
          PY
      - name: Detect SQLite connection leaks
        run: |
          python3 - <<'PYCODE'
          import gc, unittest, warnings
          with warnings.catch_warnings(record=True) as caught:
              warnings.simplefilter('always', ResourceWarning)
              suite = unittest.defaultTestLoader.discover('tests')
              result = unittest.TextTestRunner(verbosity=1).run(suite)
              gc.collect()
          leaks = [str(w.message) for w in caught
                   if issubclass(w.category, ResourceWarning)
                   and 'sqlite3.Connection' in str(w.message)]
          if leaks:
              raise SystemExit('Unclosed SQLite connections: ' + repr(leaks[:5]))
          if not result.wasSuccessful():
              raise SystemExit('Tests failed in leak check')
          PYCODE
      - name: Synthetic end-to-end smoke test
        run: |
          python3 -m verdugo demo > /tmp/verdugo-demo.json
          python3 -c "import json; x=json.load(open('/tmp/verdugo-demo.json')); assert x['synthetic_only'] and x['external_calls']==0 and x['workflow']['state']=='succeeded'"
      - name: Termux-first sales desk safety gates
        run: |
          python3 -m verdugo --state :memory: sales-desk > /tmp/verdugo-sales-desk.json
          python3 -c "import json; x=json.load(open('/tmp/verdugo-sales-desk.json')); assert x['sales']['reported_paid_clients']==0 and x['sales']['commercial_success_probability'] is None and x['external_calls_made'] is False and x['adapters_implemented']==43"
      - name: Commercial truth gates
        run: |
          python3 -m verdugo --state :memory: commercial-report > /tmp/verdugo-sales-report.json
          python3 -c "import json; x=json.load(open('/tmp/verdugo-sales-report.json')); assert x['reported_paid_clients']==0 and x['gap_to_min']==6 and x['commercial_success_probability'] is None and x['bank_reconciled'] is False"
      - name: Pilot and backup safety gates
        run: |
          python3 -m verdugo --state :memory: status > /tmp/verdugo-v06-status.json
          python3 -c "import json; x=json.load(open('/tmp/verdugo-v06-status.json')); assert x['live_verified']==0 and x['api_adapters_implemented']==43"
          if python3 -m verdugo --state :memory: pilot @examples/pilot-request.json --execute; then
            echo "ERROR: unconfigured pilot must fail closed" >&2
            exit 1
          fi
      - name: Verdugo 322 immutable source evidence gates
        run: |
          python3 -m verdugo sources > /tmp/verdugo-source-evidence.json
          python3 -c "import json; x=json.load(open('/tmp/verdugo-source-evidence.json')); assert x['registered']==322 and x['source_pinned']==322 and x['license_review_pending']==322 and x['license_policy_allowed']==300 and x['license_policy_excluded']==22 and x['http_adapters_implemented']==43 and x['without_http_adapter']==279 and x['live_verified']==0 and x['external_calls_made'] is False"
          python3 -m verdugo source-inspect twenty > /tmp/verdugo-source-single.json
          python3 -c "import json; x=json.load(open('/tmp/verdugo-source-single.json')); assert len(x['source_commit_sha'])==40 and x['ready_for_production'] is False"
      - name: Registry truth checks
        run: |
          python3 -m verdugo --state :memory: status > /tmp/verdugo-status.json
          python3 -c "import json; x=json.load(open('/tmp/verdugo-status.json')); assert x['registered']==322 and x['api_adapters_implemented']==43 and x['api_actions_implemented']==47 and x['total_adapters_implemented']==62 and x['projects_without_any_adapter']==260 and x['adapters_usable_under_policy']==43 and x['live_verified']==0"
      - name: License policy gates (v0.14)
        run: |
          python3 -m verdugo licenses > /tmp/verdugo-licenses.json
          python3 -c "import json; x=json.load(open('/tmp/verdugo-licenses.json')); assert x['registered']==322 and x['allowed']==300 and len(x['excluded'])==22 and x['legal_advice'] is False and x['license_review_pending']==322"
          python3 -m verdugo licenses twenty > /tmp/verdugo-license-twenty.json
          python3 -c "import json; x=json.load(open('/tmp/verdugo-license-twenty.json')); assert x['policy']=='excluido' and x['license_review']=='pending'"

  python314:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned Python 3.14 action
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.14'
      - name: Run Python 3.14 with SQLite ResourceWarning audit
        run: |
          python - <<'PYCODE'
          import gc, os, unittest, warnings
          os.umask(0o077)
          if hasattr(os, 'link'):
              del os.link
          with warnings.catch_warnings(record=True) as caught:
              warnings.simplefilter('always', ResourceWarning)
              suite = unittest.defaultTestLoader.discover('tests')
              result = unittest.TextTestRunner(verbosity=1).run(suite)
              gc.collect()
          leaks = [str(w.message) for w in caught
                   if issubclass(w.category, ResourceWarning)
                   and 'sqlite3.Connection' in str(w.message)]
          if leaks:
              raise SystemExit('Unclosed SQLite connections under 3.14: ' + repr(leaks[:5]))
          if not result.wasSuccessful():
              raise SystemExit('Python 3.14 Termux simulation failed')
          PYCODE
