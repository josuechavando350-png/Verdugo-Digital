name: Verdugo verification
on:
  push:
    branches: [main, feat/verdugo-unified-core]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verdugo-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout pinned source action
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Compile and execute local tests
        run: |
          python3 --version
          python3 -m compileall -q verdugo
          python3 -m unittest discover -s tests -v
      - name: Termux compatibility simulation
        run: |
          python3 - <<'PY'
          import os
          import unittest
          os.umask(0o077)
          if hasattr(os, 'link'):
              del os.link
          suite = unittest.defaultTestLoader.discover('tests')
          result = unittest.TextTestRunner(verbosity=1).run(suite)
          assert result.wasSuccessful(), 'Simulated Termux regression'
          PY
      - name: Detect SQLite connection leaks
        run: |
          python3 - <<'PYCODE'
          import gc, unittest, warnings
          with warnings.catch_warnings(record=True) as caught:
              warnings.simplefilter('always', ResourceWarning)
              suite = unittest.defaultTestLoader.discover('tests')
              result = unittest.TextTestRunner(verbosity=1).run(suite)
              gc.collect()
          leaks = [str(w.message) for w in caught
                   if issubclass(w.category, ResourceWarning)
                   and 'sqlite3.Connection' in str(w.message)]
          if leaks:
              raise SystemExit('Unclosed SQLite connections: ' + repr(leaks[:5]))
          if not result.wasSuccessful():
              raise SystemExit('Tests failed in leak check')
          PYCODE
      - name: Synthetic end-to-end smoke test
        run: |
          python3 -m verdugo demo > /tmp/verdugo-demo.json
          python3 -c "import json; x=json.load(open('/tmp/verdugo-demo.json')); assert x['synthetic_only'] and x['external_calls']==0 and x['workflow']['state']=='succeeded'"
      - name: Termux-first sales desk safety gates
        run: |
          python3 -m verdugo --state :memory: sales-desk > /tmp/verdugo-sales-desk.json
          python3 -c "import json; x=json.load(open('/tmp/verdugo-sales-desk.json')); assert x['sales']['reported_paid_clients']==0 and x['sales']['commercial_success_probability'] is None and x['external_calls_made'] is False and x['adapters_implemented']==104"
      - name: Commercial truth gates
        run: |
          python3 -m verdugo --state :memory: commercial-report > /tmp/verdugo-sales-report.json
          python3 -c "import json; x=json.load(open('/tmp/verdugo-sales-report.json')); assert x['reported_paid_clients']==0 and x['gap_to_min']==6 and x['commercial_success_probability'] is None and x['bank_reconciled'] is False"
      - name: Pilot and backup safety gates
        run: |
          python3 -m verdugo --state :memory: status > /tmp/verdugo-v06-status.json
          python3 -c "import json; x=json.load(open('/tmp/verdugo-v06-status.json')); assert x['live_verified']==0 and x['api_adapters_implemented']==104"
          if python3 -m verdugo --state :memory: pilot @examples/pilot-request.json --execute; then
            echo "ERROR: unconfigured pilot must fail closed" >&2
            exit 1
          fi
      - name: Verdugo 322 immutable source evidence gates
        run: |
          python3 -m verdugo sources > /tmp/verdugo-source-evidence.json
          python3 -c "import json; x=json.load(open('/tmp/verdugo-source-evidence.json')); assert x['registered']==322 and x['source_pinned']==322 and x['license_review_pending']==322 and x['license_policy_allowed']==300 and x['license_policy_excluded']==22 and x['http_adapters_implemented']==104 and x['without_http_adapter']==218 and x['live_verified']==0 and x['external_calls_made'] is False"
          python3 -m verdugo source-inspect twenty > /tmp/verdugo-source-single.json
          python3 -c "import json; x=json.load(open('/tmp/verdugo-source-single.json')); assert len(x['source_commit_sha'])==40 and x['ready_for_production'] is False"
      - name: Registry truth checks
        run: |
          python3 -m verdugo --state :memory: status > /tmp/verdugo-status.json
          python3 -c "import json; x=json.load(open('/tmp/verdugo-status.json')); assert x['registered']==322 and x['api_adapters_implemented']==104 and x['api_actions_implemented']==108 and x['total_adapters_implemented']==263 and x['projects_without_any_adapter']==59 and x['adapters_usable_under_policy']==244 and x['live_verified']==0"
      - name: License policy gates (v0.14)
        run: |
          python3 -m verdugo licenses > /tmp/verdugo-licenses.json
          python3 -c "import json; x=json.load(open('/tmp/verdugo-licenses.json')); assert x['registered']==322 and x['allowed']==300 and len(x['excluded'])==22 and x['legal_advice'] is False and x['license_review_pending']==322"
          python3 -m verdugo licenses twenty > /tmp/verdugo-license-twenty.json
          python3 -c "import json; x=json.load(open('/tmp/verdugo-license-twenty.json')); assert x['policy']=='excluido' and x['license_review']=='pending'"
      - name: Connection map gates (v0.15)
        run: |
          python3 -m verdugo connections > /tmp/verdugo-connections.json
          python3 -c "import json; x=json.load(open('/tmp/verdugo-connections.json')); assert x['registered']==322 and x['states']=={'conectado':244,'integrado_en_panel':13,'pieza_de_construccion':43,'pendiente':0,'excluido':22} and x['live_verified']==0"

      - name: Four batch-one contracts and replay evidence (synthetic providers)
        run: |
          python3 -m unittest discover -s tests -p 'test_tanda1_reads_v017.py' -v
          python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          from verdugo.connections import summary
          state=summary()
          assert state['states']=={'conectado':244,'integrado_en_panel':13,'pieza_de_construccion':43,'pendiente':0,'excluido':22}
          evidence={'commit':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],
            'baseline_commit':'35516f830cba1e0dbb06b91f44357128440fc832',
            'new_read_contracts':['openrefine','steel-browser','crawl4ai','fides'],
            'contract_tests_passed':24,'test_transport':'loopback_http',
            'synthetic_provider_responses':True,'actual_upstream_servers_executed':False,
            'permanent_deployment':False,'live_verified':0,'connection_states':state['states']}
          Path('/tmp/verdugo-tanda1-evidence.json').write_text(json.dumps(evidence,indent=2)+'\n')
          PYCODE
      - name: Preserve scoped batch-one evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verdugo-tanda1-${{ github.sha }}
          path: /tmp/verdugo-tanda1-evidence.json
          retention-days: 7
          if-no-files-found: error

      - name: Two additional first-batch contracts (synthetic HTTP responses)
        run: |
          python3 -m unittest discover -s tests -p 'test_readiness_reads_v018.py' -v
          python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          from verdugo.connections import summary
          state=summary()
          assert state['states']=={'conectado':244,'integrado_en_panel':13,'pieza_de_construccion':43,'pendiente':0,'excluido':22}
          evidence={'commit':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],
            'baseline_commit':'da34f47b6bc6116e553f08801e281f1e695dcc8c',
            'new_read_contracts':['uptime-kuma','gotenberg'],'contract_tests_passed':26,
            'synthetic_provider_responses':True,'test_transport':'loopback_http',
            'actual_upstream_servers_executed':False,'permanent_deployment':False,
            'live_verified':0,'connection_states':state['states']}
          Path('/tmp/verdugo-v018-evidence.json').write_text(json.dumps(evidence,indent=2)+'\n')
          PYCODE
      - name: Preserve v0.18 scope evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verdugo-v018-${{ github.sha }}
          path: /tmp/verdugo-v018-evidence.json
          retention-days: 7
          if-no-files-found: error

      - name: Unified product and four contracts, scoped synthetic evidence
        run: |
          python3 - <<'PYCODE'
          import json, os, unittest
          from pathlib import Path
          from verdugo.product import read_operations
          from verdugo.connections import summary
          suite = unittest.defaultTestLoader.discover('tests', pattern='test_*v019.py')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          assert result.wasSuccessful() and result.testsRun == 36
          assert len(read_operations()) == 68
          evidence = {'commit':os.environ['GITHUB_SHA'], 'run_id':os.environ['GITHUB_RUN_ID'],
              'baseline_commit':'088c759033fd52e2ece9f6cb0d23590bd378a160',
              'contract_and_product_tests_passed':result.testsRun,
              'new_read_contracts':['apache-answer','caddy','seaweedfs','dagster'],
              'combined_injected_synthetic_routes_tested':69, 'combined_loopback_routes_tested':6,
              'synthetic_provider_responses':True, 'actual_upstream_servers_executed':False,
              'original_caddy_acceptance':'separate_real_services_job_required',
              'permanent_deployment':False, 'live_verified':0, 'connection_states':summary()['states']}
          Path('/tmp/verdugo-v019-evidence.json').write_text(json.dumps(evidence,indent=2)+'\n')
          PYCODE
          python3 -m verdugo --state :memory: product-status > /tmp/verdugo-product-status.json
          python3 -c "import json; r=json.load(open('/tmp/verdugo-product-status.json')); assert r['bounded_observation_routes']==68 and r['external_calls_made'] is False and r['business']['reported_paid_clients']==0"
      - name: Preserve unified product evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verdugo-v019-${{ github.sha }}
          path: |
            /tmp/verdugo-v019-evidence.json
            /tmp/verdugo-product-status.json
          retention-days: 7
          if-no-files-found: error

  python314:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned Python 3.14 action
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.14'
      - name: Run Python 3.14 with SQLite ResourceWarning audit
        run: |
          python - <<'PYCODE'
          import gc, os, unittest, warnings
          os.umask(0o077)
          if hasattr(os, 'link'):
              del os.link
          with warnings.catch_warnings(record=True) as caught:
              warnings.simplefilter('always', ResourceWarning)
              suite = unittest.defaultTestLoader.discover('tests')
              result = unittest.TextTestRunner(verbosity=1).run(suite)
              gc.collect()
          leaks = [str(w.message) for w in caught
                   if issubclass(w.category, ResourceWarning)
                   and 'sqlite3.Connection' in str(w.message)]
          if leaks:
              raise SystemExit('Unclosed SQLite connections under 3.14: ' + repr(leaks[:5]))
          if not result.wasSuccessful():
              raise SystemExit('Python 3.14 Termux simulation failed')
          PYCODE

  panel:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
      - name: Exercise explicit operator panel installation
        run: |
          export VERDUGO_HOME="$(mktemp -d)"
          bash scripts/activar.sh --panel --solo-instalar
          echo "$VERDUGO_HOME/panel-venv/bin" >> "$GITHUB_PATH"
      - name: Verify source manifest, types, UI and static guide
        run: |
          python -m unittest discover -s tests -p 'test_panel_components_v024.py' -v
          npm run check --prefix panel
          npm test --prefix panel
      - name: Same Engine API and browser lifecycle on loopback
        env:
          PANEL_CHROMIUM: /usr/bin/google-chrome
        run: |
          python -m unittest discover -s tests_panel -v
          google-chrome --version
          npm run e2e --prefix panel
      - name: Preserve browser result and synthetic phone screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verdugo-panel-${{ github.sha }}
          path: |
            panel/test-results/
            docs/capturas-panel/
          retention-days: 7
          if-no-files-found: error
