name: Verdugo runtime acceptance
on:
  push:
    branches: [main, feat/verdugo-runtime-v09]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: runtime-${{ github.ref }}
  cancel-in-progress: true
jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Baseline unit tests and inventory
        run: |
          python3 -m unittest discover -s tests -q
          python3 -m verdugo --state :memory: status > /tmp/baseline-status.json
          git archive --format=tar HEAD > /tmp/verdugo-source.tar
      - name: Source snapshot for reproducible local validation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verdugo-source-${{ github.sha }}
          path: |
            /tmp/verdugo-source.tar
            /tmp/baseline-status.json
          retention-days: 3
          if-no-files-found: error
  local-libraries:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VERDUGO_RAGAS_PYTHON: /tmp/verdugo-ragas-venv/bin/python
      VERDUGO_RUNTIME_SERVICES: trafilatura,scrapy,duckdb,or-tools,optuna,scikit-learn,catboost,haystack,great-expectations,evidently,presidio,playwright,dlt,langgraph,llama-index,ragas,mlflow,dowhy,econml
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements/runtime.txt
            requirements/runtime.constraints.txt
            requirements/runtime-ragas.txt
      - name: Install primary exact distributions into isolated environment
        run: |
          python -m venv --copies /tmp/verdugo-runtime-venv
          chmod go-w /tmp/verdugo-runtime-venv/bin/python*
          /tmp/verdugo-runtime-venv/bin/python -m pip install -r requirements/runtime.txt --report /tmp/runtime-pip-report.json
          /tmp/verdugo-runtime-venv/bin/python -m pip freeze > /tmp/runtime-resolved-versions.txt
          /tmp/verdugo-runtime-venv/bin/python -m pip check
      - name: Install separate compatible Ragas environment
        run: |
          python -m venv --copies /tmp/verdugo-ragas-venv
          chmod go-w /tmp/verdugo-ragas-venv/bin/python*
          /tmp/verdugo-ragas-venv/bin/python -m pip install -r requirements/runtime-ragas.txt --report /tmp/ragas-pip-report.json
          /tmp/verdugo-ragas-venv/bin/python -m pip freeze > /tmp/ragas-resolved-versions.txt
          /tmp/verdugo-ragas-venv/bin/python -m pip check
      - name: Install browser for bounded static HTML tests
        env:
          PLAYWRIGHT_BROWSERS_PATH: /tmp/verdugo-browsers
        run: /tmp/verdugo-runtime-venv/bin/python -m playwright install --with-deps chromium
      - name: Prepare offline lexical tokenizer resources
        run: |
          /tmp/verdugo-runtime-venv/bin/python - <<'PYDATA'
          from llama_index.core.schema import TextNode
          from llama_index.retrievers.bm25 import BM25Retriever
          BM25Retriever.from_defaults(nodes=[TextNode(text='offline tokenizer preparation')], similarity_top_k=1)
          PYDATA
      - name: Execute actual libraries unprivileged with OS network isolation
        run: |
          sudo unshare --net -- setpriv --reuid="$(id -u)" --regid="$(id -g)" --clear-groups -- env \
            HOME="$HOME" \
            VERDUGO_RUNTIME_REQUIRED=1 \
            VERDUGO_RUNTIME_SERVICES="$VERDUGO_RUNTIME_SERVICES" \
            VERDUGO_RUNTIME_EVIDENCE=/tmp/runtime-execution-evidence.json \
            VERDUGO_RAGAS_PYTHON=/tmp/verdugo-ragas-venv/bin/python \
            PLAYWRIGHT_BROWSERS_PATH=/tmp/verdugo-browsers \
            /tmp/verdugo-runtime-venv/bin/python -m unittest discover -s tests_runtime -v
      - name: Fixed synthetic diagnostics after failure
        if: failure()
        run: |
          for case in evidently playwright dlt langgraph llama-index mlflow dowhy econml; do
            sudo unshare --net -- setpriv --reuid="$(id -u)" --regid="$(id -g)" --clear-groups -- env \
              HOME="$HOME" PLAYWRIGHT_BROWSERS_PATH=/tmp/verdugo-browsers \
              /tmp/verdugo-runtime-venv/bin/python tests_runtime/diagnose.py "$case" || true
          done
          if test -x /tmp/verdugo-ragas-venv/bin/python; then
            sudo unshare --net -- setpriv --reuid="$(id -u)" --regid="$(id -g)" --clear-groups -- \
              /tmp/verdugo-ragas-venv/bin/python tests_runtime/diagnose.py ragas || true
          fi
      - name: Record inventory and require the selected baseline profile
        run: |
          /tmp/verdugo-runtime-venv/bin/python - <<'PYCODE'
          import json, os
          from pathlib import Path
          from verdugo import local_runtime
          inventory = local_runtime.inventory()
          Path('/tmp/runtime-availability.json').write_text(json.dumps(inventory, indent=2)+'\n')
          selected = os.environ['VERDUGO_RUNTIME_SERVICES'].split(',')
          missing = [sid for sid in selected if not local_runtime.installed(sid)['version_matches']]
          assert len(selected) == 19 and not missing, missing
          PYCODE
      - name: Runtime evidence and resolved versions
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verdugo-runtime-evidence-${{ github.sha }}
          path: |
            /tmp/runtime-execution-evidence.json
            /tmp/runtime-workflow-evidence.json
            /tmp/runtime-extended-workflow-evidence.json
            /tmp/runtime-pip-report.json
            /tmp/runtime-resolved-versions.txt
            /tmp/ragas-pip-report.json
            /tmp/ragas-resolved-versions.txt
            /tmp/runtime-availability.json
          retention-days: 3
          if-no-files-found: warn
  local-expansion:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        group: [expansion, interop, knowledge]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/runtime-*.txt
      - name: Install isolated exact runtime profiles
        run: python tests_runtime/install_expansion.py --group "${{ matrix.group }}"
      - name: Execute original libraries and product composition offline
        run: |
          sudo unshare --net -- setpriv --reuid="$(id -u)" --regid="$(id -g)" --clear-groups -- env \
            HOME="$HOME" \
            VERDUGO_RUNTIME_REQUIRED=1 \
            VERDUGO_RUNTIME_EVIDENCE=/tmp/${{ matrix.group }}-execution-evidence.json \
            python tests_runtime/accept_expansion.py --group "${{ matrix.group }}"
      - name: Persist execution evidence and dependency graphs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verdugo-${{ matrix.group }}-evidence-${{ github.sha }}
          path: |
            /tmp/*-execution-evidence.json
            /tmp/*-product-evidence.json
            /tmp/*-pip-report.json
            /tmp/*-resolved.txt
          retention-days: 3
          if-no-files-found: warn
  local-final:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        group: [content021, entities021, pycli021, node, cli-security, cli-storage, planning021, utility021, browser021, storm021, dbt021, a2a021, research021, meridian021, causal021, r021, finalpy021, database021, tools021, source021, media021, images021, lastnode021]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/runtime-*.txt
      - name: Install original fixed profiles explicitly
        run: python tests_runtime/install_final.py --group "${{ matrix.group }}"
      - name: Run original programs with OS network isolation and restart
        run: |
          sudo unshare --net -- setpriv --reuid="$(id -u)" --regid="$(id -g)" --clear-groups -- env \
            HOME="$HOME" python tests_runtime/accept_final.py --group "${{ matrix.group }}"
      - name: Persist scoped results and dependency evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verdugo-final-${{ matrix.group }}-${{ github.sha }}
          path: |
            /tmp/*-execution-evidence.json
            /tmp/*-product-evidence.json
            /tmp/*-pip-report.json
            /tmp/*-resolved.txt
          retention-days: 3
          if-no-files-found: warn
