name: Verdugo apply verified v0.18 source
on:
  push:
    branches: [feat/v0.18-tanda1-service-readiness]
    paths: [.github/workflows/apply-verified-v018.yml]
permissions:
  contents: write
concurrency:
  group: publish-verdugo-v018
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'josuechavando350-png/Verdugo-Digital' && github.ref == 'refs/heads/feat/v0.18-tanda1-service-readiness'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          submodules: false
      - name: Restore only the exact locally tested source tree
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor da34f47b6bc6116e553f08801e281f1e695dcc8c HEAD
          python3 - <<'PY'
          import hashlib, lzma, os, subprocess
          from pathlib import Path
          base='da34f47b6bc6116e553f08801e281f1e695dcc8c'
          expected={f'.github/v018-transfer/part{i}.xz' for i in range(1,5)}
          expected.add('.github/workflows/apply-verified-v018.yml')
          changed=set(subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines())
          assert changed==expected, 'Unexpected changes since the exact reviewed base'
          digests=['ab8d81f930d1e89bf19df0c0847145124bff3ef9','ff7ecb6bf17d36c702d74c7617ceac2c3c6cf219','20e75c607e8cdd8f5fade631f6bed51158011741','2c30d55315328b7a4a0df07d6155faa20f744ffd']
          chunks=[]
          for i,digest in enumerate(digests,1):
              p=Path(f'.github/v018-transfer/part{i}.xz')
              assert p.is_file() and not p.is_symlink()
              data=p.read_bytes()
              assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==digest
              chunks.append(data)
          patch=lzma.decompress(b''.join(chunks),memlimit=64*1024*1024)
          assert len(patch)==58275
          assert hashlib.sha256(patch).hexdigest()=='f976be915f2baa72c1f43b9f8e4f27e6ba3c756b40b7507b28652e5339588601'
          Path(os.environ['RUNNER_TEMP'],'v018.patch').write_bytes(patch)
          PY
          git apply --check --unidiff-zero "$RUNNER_TEMP/v018.patch"
          git apply --index --unidiff-zero "$RUNNER_TEMP/v018.patch"
          git rm -- .github/v018-transfer/part1.xz .github/v018-transfer/part2.xz .github/v018-transfer/part3.xz .github/v018-transfer/part4.xz .github/workflows/apply-verified-v018.yml
          test "$(git write-tree)" = 20938c7a8ab9ad68f34e5614fca5fe57e5056871
          git diff --cached --check
      - name: Verify every local test before publishing
        run: |
          set -euo pipefail
          python3 -m compileall -q verdugo tests
          python3 - <<'PY'
          import json, os, unittest
          from pathlib import Path
          suite=unittest.defaultTestLoader.discover('tests')
          result=unittest.TextTestRunner(verbosity=2).run(suite)
          assert result.wasSuccessful() and result.testsRun==482
          from verdugo.connections import summary
          states=summary()['states']
          assert states=={'conectado':65,'pieza_de_construccion':56,'pendiente':179,'excluido':22}
          evidence={'source_tree':'20938c7a8ab9ad68f34e5614fca5fe57e5056871','tests_run':result.testsRun,'tests_succeeded':True,'synthetic_provider_responses':True,'actual_upstream_servers_executed':False,'permanent_deployment':False,'connection_states':states,'run_id':os.environ['GITHUB_RUN_ID']}
          Path(os.environ['RUNNER_TEMP'],'v018-publish-evidence.json').write_text(json.dumps(evidence,indent=2)+'\n')
          PY
          git diff --exit-code
          test "$(git write-tree)" = 20938c7a8ab9ad68f34e5614fca5fe57e5056871
      - name: Commit only to the isolated continuation branch
        env:
          TARGET_BRANCH: feat/v0.18-tanda1-service-readiness
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/$TARGET_BRANCH"
          remote_sha=$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)
          test "$remote_sha" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(v0.18): continue Claude batch one with two bounded read contracts' -m 'Uptime Kuma authenticated monitor inventory and Gotenberg reviewed-proxy health summary share the existing Engine, CLI, MCP and SQLite. All 482 tests passed against source tree 20938c7a8ab9ad68f34e5614fca5fe57e5056871. Defaults remain disabled and license review mandatory. Synthetic contract tests are not upstream service deployment. 65 implemented entries, 179 pending, 56 building blocks and 22 excluded. No main or prior PR branch is modified. Temporary source-transfer files and workflow removed.'
          test "$(git show -s --format=%T HEAD)" = 20938c7a8ab9ad68f34e5614fca5fe57e5056871
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          echo "PUBLISHED_COMMIT=$(git rev-parse HEAD)"
          echo 'PUBLISHED_TREE=20938c7a8ab9ad68f34e5614fca5fe57e5056871'
      - name: Retain bounded verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verdugo-v018-publish-evidence
          path: ${{ runner.temp }}/v018-publish-evidence.json
          if-no-files-found: warn
          retention-days: 1
